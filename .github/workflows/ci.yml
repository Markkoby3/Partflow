name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory-api:
    name: Inventory API (TypeScript + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partflow
          POSTGRES_PASSWORD: partflow
          POSTGRES_DB: partflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U partflow" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/inventory-api
    env:
      TEST_DATABASE_URL: postgres://partflow:partflow@localhost:5432/partflow_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/inventory-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  reorder-service:
    name: Reorder service (Python + MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: services/reorder-service
    env:
      MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/reorder-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest
        run: |
          set -o pipefail
          # Failures are also emitted as annotations so they show on the PR and run summary.
          pytest -p no:warnings -rf --tb=short 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR)|^E " pytest.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Policy backtest
        run: python scripts/backtest.py --seed 7

  web:
    name: Dashboard (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end (Kafka event path)
    needs: [inventory-api, reorder-service]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partflow
          POSTGRES_PASSWORD: partflow
          POSTGRES_DB: partflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U partflow" --health-interval 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://partflow:partflow@localhost:5432/partflow
      KAFKA_BROKERS: localhost:9092
      MONGO_URL: mongodb://localhost:27017
      INVENTORY_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Start Redpanda (Kafka API)
        run: |
          docker run -d --name redpanda -p 9092:9092 docker.redpanda.com/redpandadata/redpanda:v24.2.7 \
            redpanda start --mode dev-container --smp 1 \
            --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr localhost:9092
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true' && break
            sleep 2
          done
          docker exec redpanda rpk topic create partflow.inventory --partitions 6
      - name: Build services
        run: |
          (cd services/inventory-api && npm ci && npm run build)
          pip install -e "services/reorder-service[dev]"
      - name: Kafka publisher integration test
        working-directory: services/inventory-api
        env:
          TEST_DATABASE_URL: postgres://partflow:partflow@localhost:5432/partflow
        run: npx vitest run test/kafka.test.ts
      - name: Start stack
        run: |
          (cd services/inventory-api && nohup node dist/server.js > /tmp/api.log 2>&1 &)
          (cd services/reorder-service && nohup python -m reorder.consumer > /tmp/consumer.log 2>&1 &)
          (cd services/reorder-service && nohup uvicorn reorder.api:main_app --factory --port 8090 > /tmp/reorder-api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && curl -sf localhost:8090/readyz && break; sleep 1; done
      - name: Seed demo plant
        working-directory: services/inventory-api
        run: npx tsx scripts/seed.ts
      - name: End-to-end checks
        run: python scripts/e2e.py
      - name: Service logs
        if: always()
        run: |
          for f in /tmp/api.log /tmp/consumer.log /tmp/reorder-api.log; do echo "::group::$f"; tail -n 200 "$f" || true; echo "::endgroup::"; done

  images:
    name: Container images
    needs: [inventory-api, reorder-service, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t partflow/inventory-api services/inventory-api
      - run: docker build -t partflow/reorder-service services/reorder-service
      - run: docker build -t partflow/web web
      - name: Compose file is valid
        run: docker compose config -q

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render with kustomize and validate against Kubernetes schemas
        run: kubectl kustomize deploy/k8s | docker run --rm -i ghcr.io/yannh/kubeconform:latest -strict -summary -
