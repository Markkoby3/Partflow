apiVersion: apps/v1
kind: Deployment
metadata:
  name: reorder-consumer
  labels: { app: reorder-consumer }
spec:
  # One consumer group; Kafka spreads the topic's partitions across replicas.
  replicas: 2
  selector:
    matchLabels: { app: reorder-consumer }
  template:
    metadata:
      labels: { app: reorder-consumer }
    spec:
      securityContext: { runAsNonRoot: true }
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          image: partflow/reorder-service
          command: ["python", "-m", "reorder.consumer"]
          envFrom:
            - configMapRef: { name: partflow-config }
            - secretRef: { name: partflow-secrets }
          env:
            - { name: OTEL_SERVICE_NAME, value: reorder-consumer }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reorder-api
  labels: { app: reorder-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: reorder-api }
  template:
    metadata:
      labels: { app: reorder-api }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: api
          image: partflow/reorder-service
          ports: [{ name: http, containerPort: 8090 }]
          envFrom:
            - configMapRef: { name: partflow-config }
            - secretRef: { name: partflow-secrets }
          env:
            - { name: OTEL_SERVICE_NAME, value: reorder-api }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: reorder-api
spec:
  selector: { app: reorder-api }
  ports: [{ name: http, port: 8090, targetPort: http }]
